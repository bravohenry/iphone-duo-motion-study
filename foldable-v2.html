    <main>
      <section id="stage" aria-label="Foldable product viewer">
        <canvas id="webgl" aria-label="Interactive foldable product model. Drag to orbit and use the scroll wheel to zoom."></canvas>
        <nav id="lesson-switcher" class="glass" aria-label="Teaching views" role="tablist">
          <button class="lesson-tab" type="button" role="tab" aria-selected="true" data-view="mockup">Mockup</button>
          <button class="lesson-tab" type="button" role="tab" aria-selected="false" data-view="demo">Product Demo</button>
          <button class="lesson-tab" type="button" role="tab" aria-selected="false" data-view="pipeline">WebGL Pipeline</button>
        </nav>
        <button id="reset-view" class="icon-button glass" type="button" aria-label="Reset 3D view" title="Reset view">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/></svg>
        </button>
        <a id="github-link" class="icon-button glass" href="https://github.com/bravohenry/iphone-duo-motion-study" target="_blank" rel="noreferrer" aria-label="View source on GitHub" title="GitHub">

        </a>
        <button id="download-png" class="icon-button glass" type="button" aria-label="Download transparent PNG" title="Download transparent PNG" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 18v2h14v-2"/></svg>
        </button>
        <div class="panel">
          <div id="fold-controls" class="glass">
            <input id="fold" type="range" min="0" max="1" step="0.001" value="0.333" aria-label="Fold amount" />
            <output id="fold-value" for="fold">33%</output>
            <button id="auto-center" type="button" aria-pressed="false">Auto center</button>
          </div>
          <nav id="controls" class="glass" aria-label="Product poses"></nav>
        </div>
        <aside id="mockup-panel" class="lesson-panel glass" aria-label="Screen mockup controls">
          <div class="mockup-heading"><h2>Screen Mockup</h2><button id="mockup-clear" class="text-button" type="button">Clear</button></div>
          <label id="mockup-drop" for="mockup-file" tabindex="0">
            <strong>Choose an image</strong><span>or drop PNG, JPG, WebP or AVIF</span>
          </label>
          <input id="mockup-file" type="file" accept="image/png,image/jpeg,image/webp,image/avif" hidden />
          <div id="mockup-targets" class="mockup-segment" aria-label="Target screen">
            <button type="button" data-target="both" aria-pressed="true">Both</button>
            <button type="button" data-target="inner" aria-pressed="false">Inner</button>
            <button type="button" data-target="outer" aria-pressed="false">Outer</button>
          </div>
          <label class="mockup-row"><span>Fit</span><select id="mockup-fit"><option value="cover">Cover</option><option value="contain">Contain</option></select></label>

          <label class="mockup-row"><span>Left / right</span><input id="mockup-x" type="range" min="-1" max="1" step="0.01" value="0" /></label>
          <label class="mockup-row"><span>Up / down</span><input id="mockup-y" type="range" min="-1" max="1" step="0.01" value="0" /></label>
          <p class="mockup-hint">Drag to rotate · scroll to zoom · right-drag to move</p>
        </aside>
        <aside id="pipeline-panel" class="lesson-panel glass" aria-label="WebGL rendering stages" hidden>
          <h2>WebGL Pipeline</h2>
          <p>Inspect each render target before it reaches the device screen.</p>
          <div id="pipeline-stages"></div>
          <p id="stage-description"></p>
        </aside>
        <p id="status" class="glass" role="alert" hidden></p>
